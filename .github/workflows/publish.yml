# Publishes @hrhv/imgwand (the library) and @hrhv/imgwand-cli to GitHub Packages when a release is created.
# https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Dependency install scripts run in this job; don't leave the token in .git/config for them.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: "@hrhv"
      # Pure Perl, pinned release commit from GitHub: no apt mirrors involved (see ci.yml).
      - name: Install ExifTool
        env:
          EXIFTOOL_COMMIT: 1da714924f67763b6a8a7013dd2aa1983a16f87b # 13.63
        run: |
          mkdir -p "$RUNNER_TEMP/exiftool"
          curl -fsSL --proto '=https' --retry 5 --retry-all-errors "https://github.com/exiftool/exiftool/archive/$EXIFTOOL_COMMIT.tar.gz" | tar -xz -C "$RUNNER_TEMP/exiftool" --strip-components=1
          echo "$RUNNER_TEMP/exiftool" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/exiftool/exiftool" -ver
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          IMGWAND_REQUIRE_EXIFTOOL: "1"
      - run: npm run build
      - name: Check the release tag matches the package versions
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for pkg in packages/core packages/cli; do
            version="$(node -p "require('./$pkg/package.json').version")"
            if [ "${TAG#v}" != "$version" ]; then echo "::error::Release tag $TAG does not match $pkg version $version"; exit 1; fi
          done
      # The library first: the CLI depends on it. Pre-releases go to the "next" dist-tag so a plain install keeps
      # resolving to the latest stable version.
      - run: npm publish --workspace @hrhv/imgwand --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
      - run: npm publish --workspace @hrhv/imgwand-cli --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
